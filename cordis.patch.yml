# dsh-desktop-statusbar bundle 层
#
# 一个包一个组件。开发模式是主插件的一部分，**没有独立开关** ——
# 它只是作者调试用的入口（底栏吃假数据 + 连点版本号进出），日常不出现，
# 也不会在界面上多出任何可见控件。
#
# 曾经拆成过第二个组件（插件管理页单独开关），已经回退。原因：单包只能声明
# 一份客户端入口、client.js 是单份打包的，关掉组件**不会**卸载那部分代码 ——
# 于是"关掉"只能靠客户端运行时探测/轮询去管控，名不副实。
# 拆成多个 npm 包才能真正隔离，但那个代价不值得。
- insert:
    - id: dsh-desktop-statusbar
      name: 'dsh-desktop-statusbar'
      config: {}
